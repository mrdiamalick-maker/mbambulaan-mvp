name: CI

on:
  pull_request:
    branches: [main, docs/blueprint-produit-1.0]
  push:
    branches: [main, feature-etat-control-tower-refonte]

jobs:
  validate:
    name: Lint, test, typecheck and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build
