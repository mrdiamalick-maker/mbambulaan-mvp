name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature-etat-control-tower-refonte]

jobs:
  validate:
    name: Validate product
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Domain and permission tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Product smoke test
        run: npm run test:e2e
