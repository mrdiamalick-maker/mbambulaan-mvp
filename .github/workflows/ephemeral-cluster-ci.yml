name: Ephemeral Cluster CI

on:
  push:
    branches:
      - feature/service-coordination-domain
  pull_request:

permissions:
  contents: read

jobs:
  fresh-cluster-installation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create ephemeral Kubernetes cluster
        uses: helm/kind-action@v1.12.0
        with:
          cluster_name: mbambulaan-ci

      - name: Build integration image
        run: docker build --tag mbambulaan-platform:ci .

      - name: Load image into cluster
        run: kind load docker-image mbambulaan-platform:ci --name mbambulaan-ci

      - name: Provision PostgreSQL dependency
        run: |
          kubectl create namespace mbambulaan-data
          kubectl apply -n mbambulaan-data -f - <<'EOF'
          apiVersion: v1
          kind: Secret
          metadata:
            name: postgres-credentials
          stringData:
            POSTGRES_DB: mbambulaan
            POSTGRES_USER: mbambulaan
            POSTGRES_PASSWORD: mbambulaan-ci-password
          ---
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: postgres
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: postgres
            template:
              metadata:
                labels:
                  app: postgres
              spec:
                containers:
                  - name: postgres
                    image: postgres:16-alpine
                    envFrom:
                      - secretRef:
                          name: postgres-credentials
                    ports:
                      - containerPort: 5432
                    readinessProbe:
                      exec:
                        command: ["sh", "-c", "pg_isready -U mbambulaan -d mbambulaan"]
                      periodSeconds: 3
                    resources:
                      requests:
                        cpu: 100m
                        memory: 128Mi
                      limits:
                        cpu: 500m
                        memory: 512Mi
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: postgres
          spec:
            selector:
              app: postgres
            ports:
              - port: 5432
                targetPort: 5432
          EOF
          kubectl -n mbambulaan-data rollout status deployment/postgres --timeout=5m

      - name: Render integration release with local image
        run: |
          overlay="infra/kubernetes/overlays/integration"
          cp "${overlay}/kustomization.yaml" "${overlay}/kustomization.yaml.bak"
          sed -i -E 's#newName: ghcr.io/mrdiamalick-maker/mbambulaan-mvp#newName: mbambulaan-platform#' "${overlay}/kustomization.yaml"
          sed -i -E 's#newTag: integration#newTag: ci#' "${overlay}/kustomization.yaml"
          kubectl kustomize "$overlay" > rendered-integration.yaml
          mv "${overlay}/kustomization.yaml.bak" "${overlay}/kustomization.yaml"
          grep -q 'image: mbambulaan-platform:ci' rendered-integration.yaml

      - name: Prepare application namespace and secrets
        run: |
          kubectl apply -f - <<'EOF'
          apiVersion: v1
          kind: Namespace
          metadata:
            name: mbambulaan-integration
          EOF
          kubectl -n mbambulaan-integration create secret generic mbambulaan-platform-secrets \
            --from-literal=DATABASE_URL='postgresql://mbambulaan:mbambulaan-ci-password@postgres.mbambulaan-data.svc.cluster.local:5432/mbambulaan' \
            --from-literal=PUBLIC_BASE_URL='http://mbambulaan-platform-integration' \
            --from-literal=OBJECT_STORAGE_ENDPOINT='https://object-storage.invalid' \
            --from-literal=OBJECT_STORAGE_BUCKET='mbambulaan-ci' \
            --from-literal=OBJECT_STORAGE_REGION='sn-dakar-1' \
            --from-literal=ENCRYPTION_KEY_ID='ci-key' \
            --from-literal=TELEMETRY_ENDPOINT='https://telemetry.invalid'

      - name: Install integration release
        run: |
          kubectl apply -f rendered-integration.yaml 2>&1 | tee installation.log
          kubectl -n mbambulaan-integration get all

      - name: Verify database migrations
        run: |
          kubectl -n mbambulaan-integration wait \
            --for=condition=complete \
            job/mbambulaan-database-migration-integration \
            --timeout=10m
          kubectl -n mbambulaan-integration logs job/mbambulaan-database-migration-integration

      - name: Verify application rollout
        run: |
          kubectl -n mbambulaan-integration rollout status \
            deployment/mbambulaan-platform-integration \
            --timeout=10m

      - name: Verify liveness and readiness
        run: |
          kubectl -n mbambulaan-integration port-forward service/mbambulaan-platform-integration 18080:80 > port-forward.log 2>&1 &
          port_forward_pid=$!
          cleanup() { kill "$port_forward_pid" >/dev/null 2>&1 || true; cat port-forward.log || true; }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/api/health/live >/dev/null \
              && curl --fail --silent http://127.0.0.1:18080/api/health/ready >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          kubectl -n mbambulaan-integration get all
          kubectl -n mbambulaan-integration describe pods
          exit 1

      - name: Publish installation evidence
        if: always()
        run: |
          mkdir -p deployment-evidence
          kubectl get namespaces -o yaml > deployment-evidence/namespaces.yaml
          kubectl -n mbambulaan-integration get all -o yaml > deployment-evidence/application-resources.yaml || true
          kubectl -n mbambulaan-data get all -o yaml > deployment-evidence/data-resources.yaml || true
          kubectl -n mbambulaan-integration get events --sort-by=.lastTimestamp > deployment-evidence/application-events.txt || true
          kubectl -n mbambulaan-integration logs job/mbambulaan-database-migration-integration > deployment-evidence/migration.log 2>&1 || true
          cp rendered-integration.yaml deployment-evidence/rendered-integration.yaml
          cp installation.log deployment-evidence/installation.log 2>/dev/null || true
          cp port-forward.log deployment-evidence/port-forward.log 2>/dev/null || true

      - name: Upload installation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ephemeral-cluster-installation-evidence
          path: deployment-evidence
          retention-days: 14
