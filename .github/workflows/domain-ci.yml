name: Domain CI

on:
  push:
    branches:
      - feature/service-coordination-domain
  pull_request:

jobs:
  domain-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        shell: bash
        run: |
          set +e
          npm run typecheck > /tmp/typecheck.log 2>&1
          status=$?
          tail -n 120 /tmp/typecheck.log
          exit $status

      - name: Domain tests
        run: npm test

      - name: Application build
        run: npm run build
