name: Deployment CI

on:
  push:
    branches:
      - feature/service-coordination-domain
  pull_request:

jobs:
  package-and-manifests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.31.0

      - name: Render and validate Kubernetes manifests
        run: |
          kubectl kustomize infra/kubernetes/base > rendered-platform.yaml
          grep -q "kind: Deployment" rendered-platform.yaml
          grep -q "kind: HorizontalPodAutoscaler" rendered-platform.yaml
          grep -q "kind: PodDisruptionBudget" rendered-platform.yaml
          grep -q "kind: NetworkPolicy" rendered-platform.yaml
          grep -q "kind: Job" rendered-platform.yaml

      - name: Build hardened container image
        id: image
        continue-on-error: true
        run: |
          mkdir -p ci-diagnostics
          docker build --progress=plain --tag mbambulaan-platform:${{ github.sha }} . > ci-diagnostics/docker-build.log 2>&1

      - name: Publish Docker diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-build-diagnostics
          path: ci-diagnostics/docker-build.log
          retention-days: 7

      - name: Container build gate
        if: always()
        run: test "${{ steps.image.outcome }}" = "success"

      - name: Inspect container user
        run: |
          user=$(docker inspect --format '{{.Config.User}}' mbambulaan-platform:${{ github.sha }})
          test "$user" = "1001:1001"

      - name: Inspect container healthcheck
        run: |
          health=$(docker inspect --format '{{json .Config.Healthcheck}}' mbambulaan-platform:${{ github.sha }})
          test "$health" != "null"
