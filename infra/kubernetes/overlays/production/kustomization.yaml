apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mbambulaan-production
resources:
  - ../../base
  - external-secret.yaml
nameSuffix: -production
labels:
  - pairs:
      app.kubernetes.io/environment: production
images:
  - name: ghcr.io/mrdiamalick-maker/mbambulaan-mvp
    newTag: production
patches:
  - target:
      kind: Namespace
      name: mbambulaan
    patch: |-
      - op: replace
        path: /metadata/name
        value: mbambulaan-production
  - target:
      kind: ConfigMap
      name: mbambulaan-platform-config
    patch: |-
      - op: replace
        path: /data/MBAMBULAAN_ENV
        value: production
      - op: replace
        path: /data/NATIONAL_MODE
        value: "true"
      - op: replace
        path: /data/SECRETS_PROVIDER
        value: vault
      - op: replace
        path: /data/MIGRATION_MODE
        value: validate
  - target:
      kind: Deployment
      name: mbambulaan-platform
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      kind: HorizontalPodAutoscaler
      name: mbambulaan-platform
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
      - op: replace
        path: /spec/maxReplicas
        value: 20
  - target:
      kind: PodDisruptionBudget
      name: mbambulaan-platform
    patch: |-
      - op: replace
        path: /spec/minAvailable
        value: 2
