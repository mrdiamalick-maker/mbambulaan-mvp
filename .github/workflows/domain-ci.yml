name: Domain CI

on:
  push:
    branches:
      - feature/service-coordination-domain
  pull_request:

jobs:
  domain-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Domain and platform tests
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p ci-diagnostics
          npm test > ci-diagnostics/tests.log 2>&1

      - name: Publish test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: residual-test-diagnostics
          path: ci-diagnostics/tests.log
          retention-days: 7

      - name: Test gate
        if: always()
        run: test "${{ steps.tests.outcome }}" = "success"

      - name: Application build
        run: npm run build
