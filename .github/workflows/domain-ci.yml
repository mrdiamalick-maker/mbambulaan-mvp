name: Domain CI

on:
  push:
    branches:
      - feature/service-coordination-domain
  pull_request:

jobs:
  domain-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p ci-diagnostics
          npm run typecheck > ci-diagnostics/typecheck.log 2>&1

      - name: Publish TypeScript diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-diagnostics
          path: ci-diagnostics/typecheck.log
          if-no-files-found: error
          retention-days: 7

      - name: Typecheck gate
        if: always()
        shell: bash
        run: test "${{ steps.typecheck.outcome }}" = "success"

      - name: Domain tests
        run: npm test

      - name: Application build
        run: npm run build
