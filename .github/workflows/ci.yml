name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature-etat-control-tower-refonte]

jobs:
  validate:
    name: Typecheck and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        id: typecheck
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee typecheck-report.log

      - name: Upload typecheck report
        if: always() && hashFiles('typecheck-report.log') != ''
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-report
          path: typecheck-report.log
          retention-days: 7

      - name: Build
        run: npm run build
