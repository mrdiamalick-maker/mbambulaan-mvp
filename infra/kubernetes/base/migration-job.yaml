apiVersion: batch/v1
kind: Job
metadata:
  name: mbambulaan-database-migration
  namespace: mbambulaan
  labels:
    app.kubernetes.io/name: mbambulaan-database-migration
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mbambulaan-database-migration
    spec:
      restartPolicy: Never
      serviceAccountName: mbambulaan-platform
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migration
          image: ghcr.io/mrdiamalick-maker/mbambulaan-migrations:latest
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              test "$MIGRATION_APPROVAL" = "approved"
              expected=0
              for file in /app/infra/postgres/migrations/*.sql; do
                expected=$((expected + 1))
                echo "Applying $file"
                psql "$DATABASE_URL" --set ON_ERROR_STOP=1 --file "$file"
              done
              actual="$(psql "$DATABASE_URL" --tuples-only --no-align --command 'SELECT count(*) FROM mbambulaan.schema_migrations')"
              invalid="$(psql "$DATABASE_URL" --tuples-only --no-align --command "SELECT count(*) FROM mbambulaan.schema_migrations WHERE checksum_sha256 IS NULL OR checksum_sha256 = '' OR applied_by IS NULL OR applied_by = ''")"
              duplicates="$(psql "$DATABASE_URL" --tuples-only --no-align --command 'SELECT count(*) - count(DISTINCT version) FROM mbambulaan.schema_migrations')"
              echo "Migration registry: expected=$expected actual=$actual invalid=$invalid duplicates=$duplicates"
              test "$actual" -eq "$expected"
              test "$invalid" -eq 0
              test "$duplicates" -eq 0
          env:
            - name: MIGRATION_APPROVAL
              value: approved
          envFrom:
            - secretRef:
                name: mbambulaan-platform-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
