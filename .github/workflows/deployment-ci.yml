name: Deployment CI

on:
  push:
    branches:
      - feature/service-coordination-domain
  pull_request:

jobs:
  package-and-manifests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.31.0

      - name: Render and validate Kubernetes base
        run: |
          kubectl kustomize infra/kubernetes/base > rendered-base.yaml
          grep -q "kind: Deployment" rendered-base.yaml
          grep -q "kind: HorizontalPodAutoscaler" rendered-base.yaml
          grep -q "kind: PodDisruptionBudget" rendered-base.yaml
          grep -q "kind: NetworkPolicy" rendered-base.yaml
          grep -q "kind: Job" rendered-base.yaml

      - name: Render environment overlays
        run: |
          for environment in integration staging production; do
            kubectl kustomize "infra/kubernetes/overlays/${environment}" > "rendered-${environment}.yaml"
            grep -q "app.kubernetes.io/environment: ${environment}" "rendered-${environment}.yaml"
            grep -q "kind: Deployment" "rendered-${environment}.yaml"
            grep -q "kind: Job" "rendered-${environment}.yaml"
          done
          grep -q "kind: ExternalSecret" rendered-production.yaml
          grep -q "MBAMBULAAN_ENV: production" rendered-production.yaml
          grep -q "MIGRATION_MODE: validate" rendered-production.yaml

      - name: Build hardened container image
        run: docker build --tag mbambulaan-platform:${{ github.sha }} .

      - name: Inspect container user
        run: |
          user=$(docker inspect --format '{{.Config.User}}' mbambulaan-platform:${{ github.sha }})
          test "$user" = "1001:1001"

      - name: Inspect container healthcheck
        run: |
          health=$(docker inspect --format '{{json .Config.Healthcheck}}' mbambulaan-platform:${{ github.sha }})
          test "$health" != "null"

      - name: Inspect migration assets
        run: |
          docker run --rm --entrypoint sh mbambulaan-platform:${{ github.sha }} -c 'test -x /usr/bin/psql && test -d /app/infra/postgres/migrations'
