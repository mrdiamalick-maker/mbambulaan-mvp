apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mbambulaan-staging
resources:
  - ../../base
nameSuffix: -staging
labels:
  - pairs:
      app.kubernetes.io/environment: staging
images:
  - name: ghcr.io/mrdiamalick-maker/mbambulaan-mvp
    newTag: staging
patches:
  - target:
      kind: Namespace
      name: mbambulaan
    patch: |-
      - op: replace
        path: /metadata/name
        value: mbambulaan-staging
  - target:
      kind: ConfigMap
      name: mbambulaan-platform-config
    patch: |-
      - op: replace
        path: /data/MBAMBULAAN_ENV
        value: staging
      - op: replace
        path: /data/NATIONAL_MODE
        value: "true"
      - op: replace
        path: /data/SECRETS_PROVIDER
        value: vault
  - target:
      kind: Deployment
      name: mbambulaan-platform
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      kind: HorizontalPodAutoscaler
      name: mbambulaan-platform
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 2
      - op: replace
        path: /spec/maxReplicas
        value: 6
  - target:
      kind: PodDisruptionBudget
      name: mbambulaan-platform
    patch: |-
      - op: replace
        path: /spec/minAvailable
        value: 1
