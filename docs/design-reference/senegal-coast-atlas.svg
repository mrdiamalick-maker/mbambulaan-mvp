<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1400" viewBox="0 0 1000 1400" fill="none">
  <title>Mbàmbulaan — Atlas Public Senegal coast reference</title>
  <desc>DA reference asset: simplified geographic silhouette of Senegal with the 20 calibrated coastal territories (18 original + Bargny/Ngaparou/Toubacouta/Ziguinchor added 2026-08-15), for visual validation before Claude Code implementation.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0b1a2a" flood-opacity="0.08"/></filter>
  </defs>
  <!-- Transparent asset by design. Host surface should be white or #f7f3e9. -->
  <g opacity="0.35" stroke="#0b1a2a" stroke-width="1.5">
    <path d="M75 210C165 165 245 155 320 175"/><path d="M60 245C155 198 240 190 315 208"/><path d="M52 280C150 232 235 225 310 242"/>
    <path d="M90 1110C185 1068 275 1062 355 1085"/><path d="M78 1145C175 1102 265 1098 348 1120"/>
  </g>
  <!-- Simplified Senegal silhouette, geographically recognizable. Contour
       ouest (littoral) reconstruit mécaniquement le 2026-08-15 : dérivé
       directement des 22 marqueurs (18 Pro + Bargny/Ngaparou/Toubacouta/
       Ziguinchor), chacun décalé de 24 unités vers l'ouest — le tracé
       d'origine passait à l'intérieur des terres par rapport à sa propre
       ligne de marqueurs (vérifié : isPointInFill faux pour 15/18 des
       marqueurs d'origine, y compris Joal). Sommet nord, bord est/
       intérieur et cap sud repris tels quels, non retouchés. Les 4
       anciens sous-tracés (qui simulaient des entailles de delta en
       coupant justement à travers les positions de Foundiougne/Djiffer/
       Toubacouta) sont fusionnés en un seul contour — les entailles de
       Ziguinchor et Toubacouta réapparaissent naturellement dans le
       tracé dérivé des marqueurs, sans jamais couper sous un marqueur. -->
  <path d="M 315 145 L 610 118 L 790 205 L 845 365 L 804 510 L 738 610 L 760 705 L 690 772 L 735 812 L 700 860 L 730 1015 L 680 1095 L 605 1140 L 520 1160 L 376 1135 L 341 1090 L 401 1055 L 311 1040 L 306 965 L 316 900 L 386 868 L 341 855 L 354 792 L 338 758 L 332 739 L 326 720 L 336 696 L 318 684 L 292 642 L 271 610 L 262 575 L 254 528 L 241 450 L 228 372 L 221 292 L 234 205 Z" fill="#f7f3e9" stroke="#0b1a2a" stroke-width="5" stroke-linejoin="round" filter="url(#shadow)"/>
  <!-- Gambia visual cut / river corridor — point ouest (375,806) réaligné
       sur le nouveau littoral, juste au sud de Joal ; le reste du tracé
       (déjà loin à l'intérieur des terres) est inchangé. -->
  <path d="M375 806 C450 792 515 800 625 820 C670 828 705 830 742 816" stroke="#ffffff" stroke-width="22" stroke-linecap="round"/>
  <path d="M375 806 C450 792 515 800 625 820 C670 828 705 830 742 816" stroke="#0b1a2a" stroke-opacity="0.18" stroke-width="2" stroke-linecap="round"/>
  <!-- Coast guide: intentionally subtle, not a second map layer. Repose
       désormais sur un sous-ensemble du nouveau contour ouest (mêmes
       points, jamais recalculés indépendamment). -->
  <path d="M234 205 L228 372 L254 528 L292 642 L326 720 L354 792 L316 900 L311 1040 L341 1090 L376 1135" stroke="#b6522f" stroke-opacity="0.22" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- 20 territory markers (18 original Pro-reference + Bargny/Ngaparou/Toubacouta/Ziguinchor,
       calibrated 2026-08-15 for the Public Atlas's own 20-territory list, which diverges from
       the Pro 18 — see src/data/public-atlas.ts). Vertical order follows the already verified
       Pro reference; x positions are adapted once to this SVG viewBox. -->
  <g font-family="Arial, sans-serif" font-size="18" fill="#0b1a2a">
    <g transform="translate(258 205)"><circle r="9" fill="#0b1a2a"/><text x="18" y="6">Saint-Louis</text></g>
    <g transform="translate(245 292)"><circle r="7" fill="#0b1a2a"/><text x="18" y="6">Lompoul</text></g>
    <g transform="translate(252 372)"><circle r="7" fill="#0b1a2a"/><text x="18" y="6">Fass Boye</text></g>
    <g transform="translate(265 450)"><circle r="7" fill="#0b1a2a"/><text x="18" y="6">Kayar</text></g>
    <g transform="translate(278 528)"><circle r="7" fill="#0b1a2a"/><text x="18" y="6">Yoff</text></g>
    <g transform="translate(286 575)"><circle r="7" fill="#0b1a2a"/><text x="18" y="6">Ouakam</text></g>
    <g transform="translate(295 610)"><circle r="7" fill="#0b1a2a"/><text x="18" y="6">Soumbédioune</text></g>
    <g transform="translate(316 642)"><circle r="7" fill="#0b1a2a"/><text x="18" y="6">Hann</text></g>
    <g transform="translate(342 684)"><circle r="7" fill="#0b1a2a"/><text x="18" y="6">Rufisque</text></g>
    <g transform="translate(360 696)"><circle r="7" fill="#0b1a2a"/><text x="18" y="6">Bargny</text></g>
    <g transform="translate(350 720)"><circle r="7" fill="#0b1a2a"/><text x="18" y="6">Popenguine</text></g>
    <g transform="translate(356 739)"><circle r="7" fill="#0b1a2a"/><text x="18" y="6">Ngaparou</text></g>
    <g transform="translate(362 758)"><circle r="7" fill="#0b1a2a"/><text x="18" y="6">Mbour</text></g>
    <g transform="translate(378 792)"><circle r="13" fill="#b6522f"/><circle r="20" stroke="#b6522f" stroke-opacity="0.28" stroke-width="3"/><text x="28" y="6" font-weight="700">Joal</text></g>
    <g transform="translate(365 855)"><circle r="7" fill="#0b1a2a"/><text x="18" y="6">Foundiougne</text></g>
    <g transform="translate(410 868)"><circle r="7" fill="#0b1a2a"/><text x="18" y="6">Toubacouta</text></g>
    <g transform="translate(340 900)"><circle r="7" fill="#0b1a2a"/><text x="18" y="6">Djiffer</text></g>
    <g transform="translate(330 965)"><circle r="7" fill="#0b1a2a"/><text x="18" y="6">Missirah</text></g>
    <g transform="translate(335 1040)"><circle r="7" fill="#0b1a2a"/><text x="18" y="6">Kafountine</text></g>
    <g transform="translate(425 1055)"><circle r="7" fill="#0b1a2a"/><text x="18" y="6">Ziguinchor</text></g>
    <g transform="translate(365 1090)"><circle r="7" fill="#0b1a2a"/><text x="18" y="6">Elinkine</text></g>
    <g transform="translate(400 1135)"><circle r="7" fill="#0b1a2a"/><text x="18" y="6">Cap Skirring</text></g>
  </g>

  <g font-family="Arial, sans-serif" fill="#0b1a2a">
    <text x="78" y="90" font-size="18" font-weight="700" letter-spacing="2">ATLAS PUBLIC · RÉFÉRENCE DA</text>
    <text x="78" y="122" font-size="15" opacity="0.62">Fond transparent · surface hôte claire · sélection terracotta</text>
    <text x="770" y="1280" font-size="14" opacity="0.5" text-anchor="end">Asset de référence — pas une carte SIG</text>
  </g>
</svg>
