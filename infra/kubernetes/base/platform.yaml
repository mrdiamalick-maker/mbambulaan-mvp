apiVersion: v1
kind: Namespace
metadata:
  name: mbambulaan
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mbambulaan-platform
  namespace: mbambulaan
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mbambulaan-platform-config
  namespace: mbambulaan
data:
  MBAMBULAAN_ENV: production
  SERVICE_NAME: mbambulaan-platform
  PORT: "3000"
  LOG_LEVEL: info
  NATIONAL_MODE: "true"
  MIGRATION_MODE: validate
  TELEMETRY_ENABLED: "true"
  OBJECT_STORAGE_BUCKET: mbambulaan-evidence
  OBJECT_STORAGE_REGION: sn-dakar-1
  SECRETS_PROVIDER: vault
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mbambulaan-platform
  namespace: mbambulaan
  labels:
    app.kubernetes.io/name: mbambulaan-platform
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mbambulaan-platform
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mbambulaan-platform
    spec:
      serviceAccountName: mbambulaan-platform
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: platform
          image: ghcr.io/mrdiamalick-maker/mbambulaan-mvp:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: mbambulaan-platform-config
            - secretRef:
                name: mbambulaan-platform-secrets
          env:
            - name: SERVICE_VERSION
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['app.kubernetes.io/version']
            - name: SERVICE_STARTED_AT
              valueFrom:
                fieldRef:
                  fieldPath: metadata.creationTimestamp
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /api/health/startup
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: next-cache
              mountPath: /app/.next/cache
      volumes:
        - name: tmp
          emptyDir: {}
        - name: next-cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mbambulaan-platform
  namespace: mbambulaan
spec:
  selector:
    app.kubernetes.io/name: mbambulaan-platform
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mbambulaan-platform
  namespace: mbambulaan
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mbambulaan-platform
  minReplicas: 3
  maxReplicas: 20
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mbambulaan-platform
  namespace: mbambulaan
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: mbambulaan-platform
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mbambulaan-platform-default-deny
  namespace: mbambulaan
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mbambulaan-platform
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3000
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mbambulaan-data
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 443
