name: Deployment CI

on:
  push:
    branches:
      - feature/service-coordination-domain
  pull_request:

jobs:
  package-and-manifests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.31.0

      - name: Validate Kubernetes manifests
        run: |
          kubectl create --dry-run=client --validate=false -f infra/kubernetes/base/platform.yaml -o yaml > /dev/null
          kubectl create --dry-run=client --validate=false -f infra/kubernetes/base/migration-job.yaml -o yaml > /dev/null

      - name: Build hardened container image
        run: docker build --tag mbambulaan-platform:${{ github.sha }} .

      - name: Inspect container user
        run: |
          user=$(docker inspect --format '{{.Config.User}}' mbambulaan-platform:${{ github.sha }})
          test "$user" = "1001:1001"

      - name: Inspect container healthcheck
        run: |
          health=$(docker inspect --format '{{json .Config.Healthcheck}}' mbambulaan-platform:${{ github.sha }})
          test "$health" != "null"
