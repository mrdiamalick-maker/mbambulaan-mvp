name: Domain CI

on:
  push:
    branches:
      - feature/service-coordination-domain
  pull_request:

jobs:
  domain-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare diagnostics
        run: mkdir -p .ci-diagnostics

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee .ci-diagnostics/typecheck.log

      - name: Domain tests
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee .ci-diagnostics/tests.log

      - name: Application build
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee .ci-diagnostics/build.log

      - name: Publish diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: domain-quality-diagnostics
          path: .ci-diagnostics
          if-no-files-found: error
          retention-days: 14

      - name: Quality gate
        if: always()
        shell: bash
        run: |
          echo "Typecheck: ${{ steps.typecheck.outcome }}"
          echo "Tests: ${{ steps.tests.outcome }}"
          echo "Build: ${{ steps.build.outcome }}"
          test "${{ steps.typecheck.outcome }}" = "success"
          test "${{ steps.tests.outcome }}" = "success"
          test "${{ steps.build.outcome }}" = "success"
