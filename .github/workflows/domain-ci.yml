name: Domain CI

on:
  push:
    branches:
      - feature/service-coordination-domain
  pull_request:

permissions:
  contents: write

jobs:
  domain-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.event.pull_request.head.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply controlled stabilization migration
        if: hashFiles('scripts/apply-industrialization-stabilization.mjs') != '' && hashFiles('.stabilization-applied') == ''
        shell: bash
        run: |
          node scripts/apply-industrialization-stabilization.mjs
          touch .stabilization-applied
          git config user.name "mbambulaan-ci"
          git config user.email "actions@users.noreply.github.com"
          git add src .stabilization-applied
          git commit -m "fix: stabiliser les contrats historiques pour l'industrialisation"
          target_branch="${{ github.event_name == 'push' && github.ref_name || github.event.pull_request.head.ref }}"
          git push origin HEAD:"$target_branch"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Domain and platform tests
        run: npm test

      - name: Application build
        run: npm run build
